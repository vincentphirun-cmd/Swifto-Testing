<!-- @dsCard group="Type" viewport="700x230" name="Display & headings" subtitle="Inter, tight tracking, semibold/bold" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); color: var(--text-strong); }
  .stack > * + * { margin-top: 14px; }
  .h1 { font-size: var(--text-6xl); font-weight: var(--weight-semibold); letter-spacing: var(--tracking-tight); line-height: 1.05; }
  .h2 { font-size: var(--text-4xl); font-weight: var(--weight-bold); }
  .h3 { font-size: var(--text-xl); font-weight: var(--weight-semibold); }
  .tag { font-size: 11px; color: var(--text-muted); font-weight: 500; }
</style>
</head>
<body>
  <div class="stack">
    <div>
      <div class="h1">Get trusted help fast.</div>
      <div class="tag">Hero — 60px / semibold / tracking −0.025em</div>
    </div>
    <div>
      <div class="h2">How it works</div>
      <div class="tag">Section head — 36px / bold</div>
    </div>
    <div>
      <div class="h3">Choose a student</div>
      <div class="tag">Card title — 20px / semibold</div>
    </div>
  </div>
</body>
</html>
