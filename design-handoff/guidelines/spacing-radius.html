<!-- @dsCard group="Spacing" viewport="700x160" name="Corner radius" subtitle="lg → xl → 2xl → 3xl → full" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-card); display: flex; gap: 18px; align-items: flex-end; }
  .col { text-align: center; }
  .box { width: 84px; height: 70px; background: var(--primary-10); border: 1.5px solid var(--swifto-primary); }
  .lab { margin-top: 8px; font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .px { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="col"><div class="box" style="border-radius:var(--radius-lg)"></div><div class="lab">lg</div><div class="px">8px · controls</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-xl)"></div><div class="lab">xl</div><div class="px">12px · buttons</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-2xl)"></div><div class="lab">2xl</div><div class="px">16px · cards</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-3xl)"></div><div class="lab">3xl</div><div class="px">24px · panels</div></div>
  <div class="col"><div class="box" style="border-radius:var(--radius-full)"></div><div class="lab">full</div><div class="px">pills · avatars</div></div>
</body>
</html>
