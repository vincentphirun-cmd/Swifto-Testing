<!-- @dsCard group="Colors" viewport="700x170" name="Status colors" subtitle="Success, warning & error states" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 20px; background: var(--surface-card); display: flex; gap: 14px; }
  .badge { flex: 1; border-radius: var(--radius-xl); padding: 14px 16px; }
  .pill { display: inline-block; font-size: 12px; font-weight: 600; padding: 3px 10px; border-radius: var(--radius-full); }
  .t { margin-top: 12px; font-size: 12px; color: var(--text-muted); }
  .t b { color: var(--text-strong); }
</style>
</head>
<body>
  <div class="badge" style="background:var(--success-bg); border:1px solid var(--success-border)">
    <span class="pill" style="background:#fff;color:var(--success-fg)">Applied</span>
    <div class="t"><b>Success</b> · green-100 / 700</div>
  </div>
  <div class="badge" style="background:var(--warning-bg)">
    <span class="pill" style="background:#fff;color:var(--warning-fg)">Urgent rebook</span>
    <div class="t"><b>Warning</b> · amber-100 / 800</div>
  </div>
  <div class="badge" style="background:var(--danger-bg); border:1px solid var(--danger-border)">
    <span class="pill" style="background:#fff;color:var(--danger-fg)">Payment failed</span>
    <div class="t"><b>Error</b> · red-50 / 800</div>
  </div>
</body>
</html>
