<!-- @dsCard group="Spacing" viewport="700x180" name="Elevation" subtitle="Resting sm, lifted xl on hover" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px 24px; background: var(--surface-card); display: flex; gap: 26px; align-items: center; flex-wrap: wrap; }
  .col { text-align: center; }
  .box { width: 120px; height: 78px; background: #fff; border: 1px solid var(--border-card); border-radius: var(--radius-2xl); }
  .lab { margin-top: 12px; font-size: 12px; font-weight: 600; color: var(--text-strong); }
  .use { font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-sm)"></div><div class="lab">sm</div><div class="use">card at rest</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-md)"></div><div class="lab">md</div><div class="use">hover (job rows)</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-lg)"></div><div class="lab">lg</div><div class="use">feature panels</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-xl); transform:translateY(-8px)"></div><div class="lab">xl</div><div class="use">card lifted on hover</div></div>
  <div class="col"><div class="box" style="box-shadow:var(--shadow-2xl)"></div><div class="lab">2xl</div><div class="use">modals</div></div>
</body>
</html>
