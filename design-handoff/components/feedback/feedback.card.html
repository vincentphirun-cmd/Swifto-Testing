<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 24px; background: var(--surface-page); }
  .group-label { font-size: 11px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-muted); margin: 0 0 12px; }
  .row { display: flex; gap: 32px; flex-wrap: wrap; align-items: center; }
  .section + .section { margin-top: 22px; }
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { StarRating, Modal, Button, Textarea } = window.SwiftoDesignSystem_8a726e;
  function Demo() {
    const [rating, setRating] = React.useState(4);
    const [open, setOpen] = React.useState(false);
    return (
      <>
        <div className="section">
          <p className="group-label">Star rating</p>
          <div className="row">
            <StarRating value={4.8} showValue reviewCount={23} />
            <StarRating value={5} size="sm" showValue reviewCount={0} />
            <div>
              <StarRating value={rating} onChange={setRating} size="lg" />
              <p style={{ fontSize: 12, color: 'var(--text-muted)', textAlign: 'center', marginTop: 4 }}>Tap to rate</p>
            </div>
          </div>
        </div>
        <div className="section">
          <p className="group-label">Modal</p>
          <Button onClick={() => setOpen(true)}>Open apply dialog</Button>
          <Modal
            open={open}
            onClose={() => setOpen(false)}
            title="Apply for Job"
            subtitle="Lawn mowing · Ponsonby, Auckland"
            footer={<Button fullWidth onClick={() => setOpen(false)}>Submit Application</Button>}
          >
            <Textarea label="Experience" rows={3} placeholder="Tell us about your relevant experience…" />
          </Modal>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
</script>
</body>
</html>
