<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<style>

</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Button, Input, Select, Checkbox, Textarea } = window.SwiftoDesignSystem_8a726e;
  function Demo() {
    const [flex, setFlex] = React.useState(true);
    return (
      <>
        <div>
          <p className="group-label">Buttons</p>
          <div className="stack">
            <div className="row">
              <Button>Post a job</Button>
              <Button variant="outline">Find jobs</Button>
              <Button variant="ghost">Show breakdown</Button>
              <Button disabled>Disabled</Button>
            </div>
            <div className="row">
              <Button size="sm">Quick Apply</Button>
              <Button size="md">Submit</Button>
              <Button size="lg">Withdraw earnings</Button>
            </div>
            <div className="band">
              <div className="row">
                <Button variant="white">Post a job</Button>
                <Button variant="outlineWhite">Find jobs</Button>
              </div>
            </div>
          </div>
        </div>
        <div>
          <p className="group-label">Inputs</p>
          <div className="stack">
            <Input label="Email address" placeholder="Enter your email" />
            <Input label="Price of Job" prefix="$" placeholder="0.00" helper="Minimum $5.00" />
            <Select label="Category" placeholder="Select a category" options={[
              { value: 'moving', label: 'Moving' },
              { value: 'cleaning', label: 'Cleaning' },
              { value: 'tutoring', label: 'Tutoring' },
            ]} />
            <Checkbox label="Flexible (no specific deadline)" checked={flex} onChange={setFlex} />
          </div>
        </div>
      </>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
